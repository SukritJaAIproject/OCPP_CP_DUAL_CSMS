<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Two sessions at the same time, one per CSMS</title><desc>Connector 1 is started by CSMS A and connector 2 by CSMS B. StartTransaction, MeterValues and StopTransaction go only to the owner; StatusNotification goes to both with the owner in info. A RemoteStop from CSMS A for B's session is rejected.</desc><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs><rect x="60" y="14" width="180" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="72" y="26" width="4" height="22" rx="2" fill="#2a78d6"/><text x="150" y="43" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">CSMS A</text><line x1="150" y1="60" x2="150" y2="676" stroke="#d0d7de" stroke-width="1.5" stroke-linecap="butt" fill="none"/><rect x="390" y="14" width="180" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="480" y="43" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Charger</text><line x1="480" y1="60" x2="480" y2="676" stroke="#d0d7de" stroke-width="1.5" stroke-linecap="butt" fill="none"/><rect x="720" y="14" width="180" height="46" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="732" y="26" width="4" height="22" rx="2" fill="#eb6834"/><text x="810" y="43" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">CSMS B</text><line x1="810" y1="60" x2="810" y2="676" stroke="#d0d7de" stroke-width="1.5" stroke-linecap="butt" fill="none"/><line x1="150" y1="100" x2="474" y2="100" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="315.0" y="91" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">RemoteStartTransaction · connector 1</text><rect x="500" y="85" width="183.39999999999998" height="24" rx="12" fill="#e9f1fb"/><circle cx="512" cy="97" r="4" fill="#2a78d6"/><text x="522" y="101" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">connector 1 belongs to A</text><line x1="480" y1="150" x2="156" y2="150" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="315.0" y="141" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">StartTransaction  →  tx 101</text><line x1="480" y1="204" x2="156" y2="204" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="315.0" y="195" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">StatusNotification · C1 Charging</text><text x="315.0" y="223" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic">info: "Session of CSMS A (tx 101)"</text><line x1="480" y1="204" x2="804" y2="204" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="645.0" y="195" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">StatusNotification · C1 Charging</text><text x="645.0" y="223" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic">info: "Session of CSMS A (tx 101)"</text><line x1="810" y1="276" x2="486" y2="276" stroke="#eb6834" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="645.0" y="267" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">RemoteStartTransaction · connector 2</text><rect x="276.6" y="261" width="183.39999999999998" height="24" rx="12" fill="#fdefe8"/><circle cx="288.6" cy="273" r="4" fill="#eb6834"/><text x="298.6" y="277" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start">connector 2 belongs to B</text><line x1="480" y1="326" x2="804" y2="326" stroke="#eb6834" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="645.0" y="317" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">StartTransaction  →  tx 555</text><line x1="480" y1="380" x2="156" y2="380" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="315.0" y="371" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">StatusNotification · C2 Charging</text><text x="315.0" y="399" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic">info: "Session of CSMS B (tx 555)"</text><line x1="480" y1="380" x2="804" y2="380" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="645.0" y="371" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">StatusNotification · C2 Charging</text><text x="645.0" y="399" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" font-style="italic">info: "Session of CSMS B (tx 555)"</text><line x1="480" y1="452" x2="156" y2="452" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="315.0" y="443" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">MeterValues · C1 · tx 101</text><line x1="480" y1="452" x2="804" y2="452" stroke="#eb6834" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="645.0" y="443" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">MeterValues · C2 · tx 555</text><line x1="150" y1="512" x2="474" y2="512" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="315.0" y="503" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">RemoteStopTransaction for B's session</text><line x1="480" y1="556" x2="156" y2="556" stroke="#6e7781" stroke-width="1.5" stroke-linecap="round" fill="none" marker-end="url(#arrow-muted)" stroke-dasharray="5 4"/><g transform="translate(197.0,535)"><circle cx="7" cy="7" r="7" fill="#d03b3b"/><path d="M4,4 L10,10 M10,4 L4,10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/></g><text x="325.0" y="547" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Rejected: not A's session</text><line x1="810" y1="612" x2="486" y2="612" stroke="#eb6834" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="645.0" y="603" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">RemoteStopTransaction · tx 555</text><line x1="480" y1="660" x2="804" y2="660" stroke="#eb6834" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="645.0" y="651" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">StopTransaction · tx 555</text></svg>
