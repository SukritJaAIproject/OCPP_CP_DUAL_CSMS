<svg xmlns="http://www.w3.org/2000/svg" width="880" height="748" viewBox="0 0 880 748" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Two sessions at the same time, one per CSMS</title><desc>Connector 1 is started by CSMS A and connector 2 by CSMS B. StartTransaction, MeterValues and StopTransaction go only to the owner; StatusNotification goes to both with the owner in info. A RemoteStop from CSMS A for B's session is rejected.</desc><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs><rect x="0.5" y="0.5" width="879" height="747" rx="16" fill="#ffffff" stroke="#d0d7de"/><rect x="45" y="24" width="170" height="50" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><rect x="58" y="37" width="4" height="24" rx="2" fill="#2a78d6"/><text x="130" y="55" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">CSMS A</text><line x1="130" y1="74" x2="130" y2="728" stroke="#c8d1da" stroke-width="1.5" stroke-linecap="butt" fill="none"/><rect x="355" y="24" width="170" height="50" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><text x="440" y="55" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Charger</text><line x1="440" y1="74" x2="440" y2="728" stroke="#c8d1da" stroke-width="1.5" stroke-linecap="butt" fill="none"/><rect x="665" y="24" width="170" height="50" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><rect x="678" y="37" width="4" height="24" rx="2" fill="#eb6834"/><text x="750" y="55" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">CSMS B</text><line x1="750" y1="74" x2="750" y2="728" stroke="#c8d1da" stroke-width="1.5" stroke-linecap="butt" fill="none"/><line x1="130" y1="118" x2="433" y2="118" stroke="#2a78d6" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="285.0" y="108" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">RemoteStartTransaction · connector 1</text><rect x="458" y="103" width="202.0" height="28" rx="14" fill="#e7f0fb"/><circle cx="472" cy="117" r="4.5" fill="#2a78d6"/><text x="483" y="122" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">connector 1 belongs to A</text><line x1="440" y1="172" x2="137" y2="172" stroke="#2a78d6" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="285.0" y="162" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">StartTransaction  →  tx 101</text><line x1="440" y1="232" x2="137" y2="232" stroke="#6e7781" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="285.0" y="222" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">StatusNotification · C1 Charging</text><text x="285.0" y="253" font-size="13" font-weight="400" fill="#424a53" text-anchor="middle" font-style="italic">info: "Session of CSMS A (tx 101)"</text><line x1="440" y1="232" x2="743" y2="232" stroke="#6e7781" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="595.0" y="222" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">StatusNotification · C1 Charging</text><text x="595.0" y="253" font-size="13" font-weight="400" fill="#424a53" text-anchor="middle" font-style="italic">info: "Session of CSMS A (tx 101)"</text><line x1="750" y1="310" x2="447" y2="310" stroke="#eb6834" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="595.0" y="300" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">RemoteStartTransaction · connector 2</text><rect x="220.0" y="295" width="202.0" height="28" rx="14" fill="#fdece4"/><circle cx="234.0" cy="309" r="4.5" fill="#eb6834"/><text x="245.0" y="314" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">connector 2 belongs to B</text><line x1="440" y1="364" x2="743" y2="364" stroke="#eb6834" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="595.0" y="354" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">StartTransaction  →  tx 555</text><line x1="440" y1="424" x2="137" y2="424" stroke="#6e7781" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="285.0" y="414" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">StatusNotification · C2 Charging</text><text x="285.0" y="445" font-size="13" font-weight="400" fill="#424a53" text-anchor="middle" font-style="italic">info: "Session of CSMS B (tx 555)"</text><line x1="440" y1="424" x2="743" y2="424" stroke="#6e7781" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="595.0" y="414" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">StatusNotification · C2 Charging</text><text x="595.0" y="445" font-size="13" font-weight="400" fill="#424a53" text-anchor="middle" font-style="italic">info: "Session of CSMS B (tx 555)"</text><line x1="440" y1="500" x2="137" y2="500" stroke="#2a78d6" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="285.0" y="490" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">MeterValues · C1 · tx 101</text><line x1="440" y1="500" x2="743" y2="500" stroke="#eb6834" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="595.0" y="490" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">MeterValues · C2 · tx 555</text><line x1="130" y1="556" x2="433" y2="556" stroke="#2a78d6" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="285.0" y="546" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">RemoteStopTransaction for B's session</text><line x1="440" y1="602" x2="137" y2="602" stroke="#59636e" stroke-width="1.75" stroke-linecap="round" fill="none" marker-end="url(#arrow-muted)" stroke-dasharray="6 5"/><g transform="translate(181.0,577)"><circle cx="8" cy="8" r="8" fill="#d03b3b"/><path d="M5,5 L11,11 M11,5 L5,11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g><text x="295.0" y="592" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">Rejected: not A's session</text><line x1="750" y1="658" x2="447" y2="658" stroke="#eb6834" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="595.0" y="648" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">RemoteStopTransaction · tx 555</text><line x1="440" y1="712" x2="743" y2="712" stroke="#eb6834" stroke-width="2.25" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="595.0" y="702" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle">StopTransaction · tx 555</text></svg>
