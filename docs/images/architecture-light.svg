<svg xmlns="http://www.w3.org/2000/svg" width="880" height="648" viewBox="0 0 880 648" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Architecture of the dual-CSMS charge point</title><desc>CSMS A and CSMS B each hold their own OCPP 1.6J WebSocket connection to the Edgebox. Inside, the dual-CSMS router owns the session table and outbox, CP.py drives the PLC over MQTT, and the service layer handles smart charging, reservations and firmware jobs.</desc><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs><rect x="0.5" y="0.5" width="879" height="647" rx="16" fill="#ffffff" stroke="#d0d7de"/><rect x="90" y="28" width="300" height="98" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><rect x="103" y="43" width="4" height="68" rx="2" fill="#2a78d6"/><text x="120" y="59" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">CSMS A</text><text x="120" y="84" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">local_csms · admin</text><text x="120" y="106" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">OCPP 1.6J over WebSocket</text><rect x="490" y="28" width="300" height="98" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><rect x="503" y="43" width="4" height="68" rx="2" fill="#eb6834"/><text x="520" y="59" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">CSMS B</text><text x="520" y="84" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">admin</text><text x="520" y="106" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">OCPP 1.6J over WebSocket</text><line x1="240" y1="126" x2="240" y2="218" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)" marker-start="url(#arrow-a)"/><line x1="640" y1="126" x2="640" y2="218" stroke="#eb6834" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)" marker-start="url(#arrow-b)"/><text x="440" y="166" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">two independent connections</text><rect x="28" y="186" width="824" height="320" rx="14" fill="none" stroke="#c8d1da" stroke-width="1.5" stroke-dasharray="7 5"/><text x="440" y="207" font-size="12" font-weight="600" fill="#59636e" text-anchor="middle" letter-spacing="0.7">EDGEBOX  ·  RASPBERRY PI  ·  ocpp.service</text><rect x="90" y="222" width="700" height="104" rx="10" fill="#ffffff" stroke="#c8d1da" stroke-width="1.5"/><text x="114" y="252" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Dual-CSMS router</text><text x="766" y="252" font-size="13" font-weight="400" fill="#59636e" text-anchor="end">helpf/dual_csms.py</text><circle cx="118" cy="272" r="3.5" fill="#6e7781"/><text x="130" y="277" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">One owner per charging session</text><circle cx="118" cy="296" r="3.5" fill="#6e7781"/><text x="130" y="301" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Outbox in SQLite, replayed on reconnect</text><circle cx="448" cy="272" r="3.5" fill="#6e7781"/><text x="460" y="277" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Status to both, owner named in info</text><circle cx="448" cy="296" r="3.5" fill="#6e7781"/><text x="460" y="301" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">RFID cards: ask A first, then B</text><rect x="90" y="350" width="340" height="136" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><text x="110" y="381" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Charge point · CP.py</text><text x="110" y="406" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">OCPP 1.6J handlers</text><text x="110" y="428" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">PLC and HMI over MQTT</text><text x="110" y="450" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Vector fault bridge</text><rect x="450" y="350" width="340" height="136" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><text x="470" y="381" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Service layer · helpf/</text><text x="470" y="406" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Smart charging and CP Max</text><text x="470" y="428" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Reservations and local list</text><text x="470" y="450" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Firmware and diagnostics jobs</text><line x1="260" y1="326" x2="260" y2="350" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="620" y1="326" x2="620" y2="350" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="380" y1="486" x2="380" y2="546" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)" marker-start="url(#arrow-neutral)"/><text x="392" y="522" font-size="13" font-weight="600" fill="#59636e" text-anchor="start">MQTT</text><rect x="290" y="548" width="300" height="74" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><text x="440.0" y="579" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">PLC · Vector VSECC</text><text x="440.0" y="603" font-size="14" font-weight="400" fill="#424a53" text-anchor="middle">ISO 15118 · DIN 70121</text><rect x="90" y="548" width="160" height="74" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><text x="170.0" y="579" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Connector 1</text><text x="170.0" y="603" font-size="14" font-weight="400" fill="#424a53" text-anchor="middle">DC, shares 120 kW</text><rect x="630" y="548" width="160" height="74" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><text x="710.0" y="579" font-size="16" font-weight="600" fill="#1f2328" text-anchor="middle">Connector 2</text><text x="710.0" y="603" font-size="14" font-weight="400" fill="#424a53" text-anchor="middle">DC, shares 120 kW</text><line x1="250" y1="585" x2="290" y2="585" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="590" y1="585" x2="630" y2="585" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
