<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Architecture of the dual-CSMS charge point</title><desc>CSMS A and CSMS B each hold their own OCPP 1.6J WebSocket connection to the Edgebox. Inside, the dual-CSMS router owns the session table and outbox, CP.py drives the PLC over MQTT, and the service layer handles smart charging, reservations and firmware jobs.</desc><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs><rect x="110" y="20" width="300" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="122" y="34" width="4" height="60" rx="2" fill="#2a78d6"/><text x="138" y="48" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">CSMS A</text><text x="138" y="72" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">local_csms · admin</text><text x="138" y="92" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">OCPP 1.6J over WebSocket</text><rect x="550" y="20" width="300" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="562" y="34" width="4" height="60" rx="2" fill="#eb6834"/><text x="578" y="48" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">CSMS B</text><text x="578" y="72" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">admin</text><text x="578" y="92" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">OCPP 1.6J over WebSocket</text><line x1="260" y1="108" x2="260" y2="196" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)" marker-start="url(#arrow-a)"/><line x1="700" y1="108" x2="700" y2="196" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)" marker-start="url(#arrow-b)"/><text x="480" y="146" font-size="12" font-weight="400" fill="#6e7781" text-anchor="middle">two independent connections</text><rect x="40" y="164" width="880" height="296" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 5"/><text x="480" y="186" font-size="11" font-weight="600" fill="#6e7781" text-anchor="middle" letter-spacing="0.6">EDGEBOX  ·  RASPBERRY PI  ·  ocpp.service</text><rect x="150" y="198" width="660" height="100" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="174" y="226" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Dual-CSMS router</text><text x="790" y="226" font-size="12" font-weight="400" fill="#6e7781" text-anchor="end">helpf/dual_csms.py</text><circle cx="178" cy="246" r="3" fill="#8c959f"/><text x="190" y="250" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">One owner per charging session</text><circle cx="178" cy="268" r="3" fill="#8c959f"/><text x="190" y="272" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Outbox in SQLite, replayed on reconnect</text><circle cx="498" cy="246" r="3" fill="#8c959f"/><text x="510" y="250" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Status to both, owner named in info</text><circle cx="498" cy="268" r="3" fill="#8c959f"/><text x="510" y="272" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">RFID: ask A first, then B</text><rect x="150" y="326" width="320" height="116" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="170" y="354" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Charge point · CP.py</text><text x="170" y="378" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">OCPP 1.6J handlers</text><text x="170" y="398" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">PLC and HMI over MQTT</text><text x="170" y="418" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Vector fault bridge</text><rect x="490" y="326" width="320" height="116" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="510" y="354" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Service layer · helpf/</text><text x="510" y="378" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Smart charging and CP Max</text><text x="510" y="398" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Reservations and local list</text><text x="510" y="418" font-size="13" font-weight="400" fill="#52514e" text-anchor="start">Firmware and diagnostics jobs</text><line x1="310" y1="298" x2="310" y2="326" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="650" y1="298" x2="650" y2="326" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="400" y1="442" x2="400" y2="502" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)" marker-start="url(#arrow-neutral)"/><text x="410" y="478" font-size="12" font-weight="600" fill="#6e7781" text-anchor="start">MQTT</text><rect x="330" y="504" width="300" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="480" y="532" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">PLC · Vector VSECC</text><text x="480" y="554" font-size="13" font-weight="400" fill="#52514e" text-anchor="middle">ISO 15118 · DIN 70121</text><rect x="130" y="504" width="160" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="210" y="532" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Connector 1</text><text x="210" y="554" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">DC, shares 120 kW</text><rect x="670" y="504" width="160" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="750" y="532" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Connector 2</text><text x="750" y="554" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">DC, shares 120 kW</text><line x1="290" y1="540" x2="330" y2="540" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none"/><line x1="630" y1="540" x2="670" y2="540" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
