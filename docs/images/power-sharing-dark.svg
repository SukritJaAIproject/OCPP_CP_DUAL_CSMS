<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Power sharing measured on the factory test charger</title><desc>Connector 1 charges alone with a 120 kW limit. When CSMS B starts connector 2, the charger lowers connector 1 to 60 kW first and then gives connector 2 60 kW. When connector 2 stops, connector 1 returns to 120 kW. Both cars drew about 50 kW, below their share.</desc><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#768390"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs><text x="74" y="30" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Limit sent to the PLC and measured power, 9 Nov 2026</text><rect x="74" y="46" width="18" height="12" rx="2" fill="#768390"/><rect x="74" y="46" width="18" height="12" rx="2" fill="#0d1117" fill-opacity="0.8"/><rect x="74" y="46" width="18" height="12" rx="2" fill="#768390" fill-opacity="0.25"/><text x="100" y="57" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">limit sent to the PLC</text><line x1="264" y1="52" x2="286" y2="52" stroke="#768390" stroke-width="2" stroke-linecap="round" fill="none"/><text x="294" y="57" font-size="12" font-weight="400" fill="#c3c2b7" text-anchor="start">measured power (MeterValues)</text><text x