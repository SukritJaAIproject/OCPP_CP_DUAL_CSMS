<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>RFID authorization order</title><desc>A card tapped at the charger is authorized by CSMS A first. If A does not accept it or does not answer, CSMS B is asked. The session belongs to the CSMS that accepted the card.</desc><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs><rect x="110.0" y="16" width="300" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="260" y="42" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Card tapped at the charger</text><text x="260" y="62" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">screen (MQTT RFIDCommand) or reader</text><line x1="260" y1="78" x2="260" y2="102" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><rect x="110.0" y="104" width="300" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="122.0" y="118" width="4" height="34" rx="2" fill="#2a78d6"/><text x="260" y="130" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Authorize  →  CSMS A</text><text x="260" y="150" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">local_csms is always asked first</text><line x1="260" y1="166" x2="260" y2="192" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><path d="M260,194.0 L360.0,231 L260,268.0 L160.0,231 z" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="260" y="236" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Accepted by A?</text><rect x="520" y="198" width="380" height="66" rx="12" fill="#e9f1fb"/><rect x="532" y="212" width="4" height="38" rx="2" fill="#2a78d6"/><text x="548" y="225" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Session belongs to CSMS A</text><text x="548" y="247" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Start, MeterValues and Stop go to A only</text><line x1="360" y1="231" x2="512" y2="231" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="440.0" y="222" font-size="12" font-weight="600" fill="#6e7781" text-anchor="middle">Accepted</text><line x1="260" y1="268" x2="260" y2="304" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="272" y="290" font-size="12" font-weight="400" fill="#6e7781" text-anchor="start">Invalid, Blocked, Expired, or no answer</text><rect x="110.0" y="306" width="300" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="122.0" y="320" width="4" height="34" rx="2" fill="#eb6834"/><text x="260" y="332" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Authorize  →  CSMS B</text><text x="260" y="352" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">only when A did not accept</text><line x1="260" y1="368" x2="260" y2="394" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><path d="M260,396.0 L360.0,433 L260,470.0 L160.0,433 z" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="260" y="438" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Accepted by B?</text><rect x="520" y="400" width="380" height="66" rx="12" fill="#fdefe8"/><rect x="532" y="414" width="4" height="38" rx="2" fill="#eb6834"/><text x="548" y="427" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">Session belongs to CSMS B</text><text x="548" y="449" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">Start, MeterValues and Stop go to B only</text><line x1="360" y1="433" x2="512" y2="433" stroke="#eb6834" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="440.0" y="424" font-size="12" font-weight="600" fill="#6e7781" text-anchor="middle">Accepted</text><line x1="260" y1="470" x2="260" y2="500" stroke="#8c959f" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="272" y="490" font-size="12" font-weight="400" fill="#6e7781" text-anchor="start">no</text><rect x="110" y="502" width="300" height="50" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><g transform="translate(128,520)"><circle cx="7" cy="7" r="7" fill="#d03b3b"/><path d="M4,4 L10,10 M10,4 L4,10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/></g><text x="268" y="532" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Not started (A's answer is shown)</text><rect x="520" y="492" width="380" height="70" rx="12" fill="none" stroke="#d0d7de" stroke-width="1"/><text x="538" y="518" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">The accepting CSMS is remembered per card</text><text x="538" y="540" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">as a SHA-256 hash, for starts that skip Authorize</text></svg>
