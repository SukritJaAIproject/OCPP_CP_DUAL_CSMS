<svg xmlns="http://www.w3.org/2000/svg" width="880" height="676" viewBox="0 0 880 676" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>RFID authorization order</title><desc>A card tapped at the charger is authorized by CSMS A first. If A does not accept it or does not answer, CSMS B is asked. The session belongs to the CSMS that accepted the card.</desc><defs><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs><rect x="0.5" y="0.5" width="879" height="675" rx="16" fill="#ffffff" stroke="#d0d7de"/><rect x="70.0" y="28" width="320" height="64" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><text x="230" y="55" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Card tapped at the charger</text><text x="230" y="77" font-size="13" font-weight="400" fill="#424a53" text-anchor="middle">screen (MQTT RFIDCommand) or reader</text><line x1="230" y1="92" x2="230" y2="120" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><rect x="70.0" y="122" width="320" height="64" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><rect x="83.0" y="136" width="4" height="36" rx="2" fill="#2a78d6"/><text x="230" y="149" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Authorize  →  CSMS A</text><text x="230" y="171" font-size="13" font-weight="400" fill="#424a53" text-anchor="middle">local_csms is always asked first</text><line x1="230" y1="186" x2="230" y2="214" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><path d="M230,216.0 L340.0,257 L230,298.0 L120.0,257 z" fill="#ffffff" stroke="#c8d1da" stroke-width="1.5"/><text x="230" y="262" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Accepted by A?</text><rect x="480" y="222" width="372" height="70" rx="12" fill="#e7f0fb"/><rect x="493" y="236" width="4" height="42" rx="2" fill="#2a78d6"/><text x="510" y="251" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Session belongs to CSMS A</text><text x="510" y="274" font-size="13" font-weight="400" fill="#424a53" text-anchor="start">Start, MeterValues and Stop go to A only</text><line x1="340" y1="257" x2="472" y2="257" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrow-a)"/><text x="410.0" y="247" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle">Accepted</text><line x1="230" y1="298.0" x2="230" y2="340.0" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="244" y="324.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Invalid, Blocked, Expired, or no answer</text><rect x="70.0" y="342.0" width="320" height="64" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><rect x="83.0" y="356.0" width="4" height="36" rx="2" fill="#eb6834"/><text x="230" y="369.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Authorize  →  CSMS B</text><text x="230" y="391.0" font-size="13" font-weight="400" fill="#424a53" text-anchor="middle">only when A did not accept</text><line x1="230" y1="406.0" x2="230" y2="434.0" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><path d="M230,436.0 L340.0,477.0 L230,518.0 L120.0,477.0 z" fill="#ffffff" stroke="#c8d1da" stroke-width="1.5"/><text x="230" y="482.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Accepted by B?</text><rect x="480" y="442.0" width="372" height="70" rx="12" fill="#fdece4"/><rect x="493" y="456.0" width="4" height="42" rx="2" fill="#eb6834"/><text x="510" y="471.0" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">Session belongs to CSMS B</text><text x="510" y="494.0" font-size="13" font-weight="400" fill="#424a53" text-anchor="start">Start, MeterValues and Stop go to B only</text><line x1="340" y1="477.0" x2="472" y2="477.0" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round" fill="none" marker-end="url(#arrow-b)"/><text x="410.0" y="467.0" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle">Accepted</text><line x1="230" y1="518.0" x2="230" y2="552.0" stroke="#6e7781" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#arrow-neutral)"/><text x="244" y="540.0" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">no</text><rect x="70.0" y="554.0" width="320" height="52" rx="10" fill="#f6f8fa" stroke="#c8d1da" stroke-width="1.25"/><g transform="translate(92.0,572.0)"><circle cx="8" cy="8" r="8" fill="#d03b3b"/><path d="M5,5 L11,11 M11,5 L5,11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g><text x="242" y="586.0" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Not started (A's answer is shown)</text><rect x="480" y="542.0" width="372" height="76" rx="12" fill="none" stroke="#c8d1da" stroke-width="1.25"/><text x="500" y="570.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start">The accepting CSMS is remembered per card</text><text x="500" y="594.0" font-size="13" font-weight="400" fill="#424a53" text-anchor="start">as a SHA-256 hash, for starts that skip Authorize</text></svg>
